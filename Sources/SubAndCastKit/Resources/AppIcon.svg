<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2129" />
      <stop offset="100%" stop-color="#0B0E13" />
    </linearGradient>

    <!-- Squircle Border Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Neon Cyan (Capture Viewfinder) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0077FE" />
    </linearGradient>

    <!-- Amber Gold (Subtitle Text Lines) -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>

    <!-- macOS App Icon Drop Shadow -->
    <filter id="iconShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Optical Glow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- macOS Squircle Base -->
  <g filter="url(#iconShadow)">
    <rect x="46" y="46" width="420" height="420" rx="92" fill="url(#bgGrad)" />
    <rect x="47" y="47" width="418" height="418" rx="91" fill="none" stroke="url(#rimGrad)" stroke-width="2" />
  </g>

  <!-- Rectangular Viewfinder (332 x 208 px, Centered at Y: 256) -->
  <g stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#subtleGlow)">
    <!-- Top-Left -->
    <path d="M 90 202 V 172 A 20 20 0 0 1 110 152 H 140" />
    <!-- Top-Right -->
    <path d="M 372 152 H 402 A 20 20 0 0 1 422 172 V 202" />
    <!-- Bottom-Left -->
    <path d="M 90 310 V 340 A 20 20 0 0 0 110 360 H 140" />
    <!-- Bottom-Right -->
    <path d="M 372 360 H 402 A 20 20 0 0 0 422 340 V 310" />
  </g>

  <!-- Capsule HUD Backdrop (276 x 132 px, rx = 62px) -->
  <rect x="118" y="190" width="276" height="132" rx="62" fill="#000000" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5" />

  <!-- Subtitle Text Lines: 4 Lines, Lines 1 & 2 Equal Length -->
  <g filter="url(#subtleGlow)">
    <!-- Line 1 (Full width: 192px) -->
    <rect x="158" y="222" width="192" height="9" rx="4.5" fill="url(#amberGrad)" />
    <!-- Line 2 (Equal to Line 1: 192px) -->
    <rect x="158" y="242" width="192" height="9" rx="4.5" fill="url(#amberGrad)" />
    <!-- Line 3 (Trailing dialogue: 148px) -->
    <rect x="158" y="262" width="148" height="9" rx="4.5" fill="url(#amberGrad)" fill-opacity="0.88" />
    <!-- Line 4 (End of sentence: 96px) -->
    <rect x="158" y="282" width="96" height="9" rx="4.5" fill="url(#amberGrad)" fill-opacity="0.72" />
  </g>
</svg>
